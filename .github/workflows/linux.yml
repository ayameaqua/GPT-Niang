name: Linux Qt companion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 dbus-x11
      - run: ./linux/setup.sh
      - name: Pure and Qt logic tests
        working-directory: linux
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Adapter lifecycle tests
        run: node --test linux/tests/adapter.test.mjs
      - name: QML smoke (not Wayland acceptance)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: dbus-run-session -- ./linux/run.sh --smoke-test
